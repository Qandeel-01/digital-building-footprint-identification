name: bfbench
channels:
  - conda-forge
  - nodefaults

# Reproduction target: Windows 11, miniconda3, NVIDIA GPU with CUDA driver
# supporting compute capability sm_120 (RTX 40/50 series). CUDA build 12.8.
#
# Rationale for every deviation from upstream's requirements.txt is documented
# in docs/environment-notes.md. Do not loosen pins without updating that doc.
#
# The two upstream packages (abd_model, abd_utils) are installed in a second
# step, editable from ./external/abd (see README + docs/reproduce.md), so they
# do NOT appear here.

dependencies:
  - python=3.11.11
  - pip=24.3.1

  # Geospatial C-lib stack (conda-forge only; pip wheels are unreliable on
  # Windows for GDAL). Keep these three lines together and versioned together.
  - libgdal=3.10.0
  - gdal=3.10.0
  - rasterio=1.4.3
  - geopandas=1.0.1
  - shapely=2.0.6
  - pyproj=3.7.0
  - fiona=1.10.1

  # Numerics & imagery
  - numpy=2.1.3
  - pandas=2.2.3
  - pillow=11.1.0
  - matplotlib-base=3.10.0
  - opencv=4.10.0

  # Upstream imports these at package import time (abd_model.tiles
  # unconditionally `import psycopg2`), so they must be installed even
  # though we don't touch a database.
  - psycopg2=2.9.10
  - python-dotenv=1.0.1

  # CLI / tooling
  - typer=0.15.1
  - pyyaml=6.0.2
  - tqdm=4.67.1
  - boto3=1.35.99
  - botocore=1.35.99
  - click=8.1.7
  - requests=2.32.3

  # Test / lint
  - pytest=8.3.4
  - ruff=0.9.1

  - pip:
      # PyTorch CUDA 12.8 wheels: required because RTX 40/50-series
      # (sm_120 Blackwell) is not covered by cu121 wheels. conda-forge
      # does not currently ship a cu128 build of torch on Windows.
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch==2.11.0
      - torchvision==0.26.0

      # Upstream tile-math dependencies
      - mercantile==1.1.5
      - supermercado==0.2.0

      # Upstream augmentation lib. Upstream pins 0.4.6, which has no wheels
      # for Python >= 3.10; bumped to the latest 1.x pre-2.0 API. See
      # docs/environment-notes.md for the compat surface actually exercised.
      - albumentations==1.4.24

      # Only used by upstream's Bing-Maps downloader path (which we do not
      # invoke) but pinned so the packages stay importable.
      - pygeotile==1.0.6
      - webcolors==24.11.1
      - toml==0.10.2
