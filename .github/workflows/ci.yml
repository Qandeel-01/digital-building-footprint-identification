name: ci

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - name: Checkout (with submodule at pinned SHA)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Miniforge
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          channels: conda-forge,nodefaults
          activate-environment: bfbench-ci
          python-version: "3.11"

      # CI env is intentionally leaner than the local env: no PyTorch, no
      # CUDA, no upstream editable install. Adapter tests must not require
      # any of that. Tests marked `gpu` or `network` are excluded.
      - name: Install runtime deps (conda-forge geospatial stack)
        run: |
          conda install -y \
            'python=3.11.11' \
            'gdal=3.10.0' \
            'libgdal=3.10.0' \
            'rasterio=1.4.3' \
            'geopandas=1.0.1' \
            'shapely=2.0.6' \
            'pyproj=3.7.0' \
            'fiona=1.10.1' \
            'numpy=2.1.3' \
            'pandas=2.2.3' \
            'pillow=11.1.0' \
            'pyyaml=6.0.2' \
            'boto3=1.35.99' \
            'botocore=1.35.99' \
            'tqdm=4.67.1' \
            'typer=0.15.1' \
            'pytest=8.3.4' \
            'ruff=0.9.1'
          pip install 'mercantile==1.1.5'

      - name: Install bfbench (no upstream, no torch)
        run: |
          # Editable install; deps are already satisfied by conda above so
          # pip should not resolve anything new.
          pip install --no-deps -e .

      - name: Ruff (lint)
        run: |
          ruff check src tests scripts

      - name: Pytest (no GPU, no network)
        run: |
          pytest -m "not gpu and not network" -q
