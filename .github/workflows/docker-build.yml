name: docker-build

# Build the Phase 0 reproducibility image. No GPU is required at build time;
# the CUDA runtime base image installs cleanly on a non-GPU runner, and all
# Python package wheels are platform-neutral at install time. See
# docs/phase0-decisions.md for why CI does not also run the smoke stack.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodule at pinned SHA)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: false
          tags: bfbench:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
