[build-system]
requires = ["setuptools==75.8.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "bfbench"
version = "0.1.0"
description = "Reproducible multi-region benchmark harness for an open-source building-footprint detector."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Qandeel Fatima" }]
dependencies = [
    "numpy==2.1.3",
    "rasterio==1.4.3",
    "geopandas==1.0.1",
    "shapely==2.0.6",
    "pyproj==3.7.0",
    "fiona==1.10.1",
    "boto3==1.35.99",
    "botocore==1.35.99",
    "typer==0.15.1",
    "pyyaml==6.0.2",
    "tqdm==4.67.1",
    "pillow==11.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "ruff==0.9.1",
    "matplotlib==3.10.0",
]

[project.scripts]
bfbench = "bfbench.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bfbench = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["external", "data", "weights", "output"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "gpu: requires CUDA-capable GPU (deselect with '-m \"not gpu\"')",
    "network: requires network access (deselect with '-m \"not network\"')",
]
